        // Sandbox Portal Switcher Logic
        const portalConfig = {
            m365: {
                name: 'Microsoft 365',
                url: 'https://login.microsoftonline.account-verify-auth.com/oauth2/login',
                analysis: '攻擊者利用 Lookalike Domain (相似網域 account-verify-auth.com) 模仿微軟 SSO 登入頁。這種手法常搭配 Spear Phishing 郵件，騙取員工的 Azure AD / Entra ID 主機憑證。'
            },
            google: {
                name: 'Google Workspace',
                url: 'https://accounts.google.com.security-notice-update.net/signin/v2',
                analysis: '偽造的 Google Workspace 登入介面。攻擊者利用子網域技巧 (security-notice-update.net) 誤導使用者以為是官方網域，目的在於竊取企業 Gmail 與 Cloud 存取權限。'
            },
            meta: {
                name: 'Meta / FB 企業粉專',
                url: 'https://facebook.business.support-policy-violation.org/verify',
                analysis: '社交工程常見的手法之一「威脅與緊急情境」。攻擊者假冒 FB 官方警告企業粉專即將被封鎖，誘騙管理員輸入粉專管理帳號密碼與 2FA 驗證碼，奪取企業廣告戶控制權。'
            }
        };

        let currentPortal = 'm365';

        function selectSandboxPortal(portalKey) {
            currentPortal = portalKey;
            const config = portalConfig[portalKey];

            // Hide all portals
            document.getElementById('portal-m365').classList.add('hidden');
            document.getElementById('portal-google').classList.add('hidden');
            document.getElementById('portal-meta').classList.add('hidden');

            // Show active portal
            document.getElementById(`portal-${portalKey}`).classList.remove('hidden');

            // Update URL bar
            document.getElementById('sandbox-fake-url').innerText = config.url;

            // Update portal buttons styling
            ['m365', 'google', 'meta'].forEach(key => {
                const btn = document.getElementById(`portal-btn-${key}`);
                if (key === portalKey) {
                    btn.className = 'px-4 py-2 text-xs font-semibold rounded-lg bg-cyan-600 text-white border border-cyan-400 flex items-center space-x-2 shadow-lg shadow-cyan-900/30 transition';
                } else {
                    btn.className = 'px-4 py-2 text-xs font-semibold rounded-lg bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 flex items-center space-x-2 transition';
                }
            });

            // Reset Interception Console
            document.getElementById('console-target-portal').innerText = `${config.name} 偽造頁面`;
            document.getElementById('console-logs').innerHTML = `<div class="text-slate-400">[READY] 切換至 ${config.name} 演練沙盒，等待憑證輸入...</div>`;
            document.getElementById('interception-alert-card').classList.add('hidden');
            document.getElementById('interception-status').innerText = '狀態: 監聽中...';
            document.getElementById('interception-status').className = 'text-xs text-slate-400 font-mono';
        }

        // Trigger Interception Analysis
        function triggerInterception(event, platformName) {
            event.preventDefault();
            const config = portalConfig[currentPortal];

            let userVal = '';
            let passVal = '';

            if (currentPortal === 'm365') {
                userVal = document.getElementById('m365-email').value;
                passVal = document.getElementById('m365-pass').value;
            } else if (currentPortal === 'google') {
                userVal = document.getElementById('google-email').value;
                passVal = document.getElementById('google-pass').value;
            } else if (currentPortal === 'meta') {
                userVal = document.getElementById('meta-email').value;
                passVal = document.getElementById('meta-pass').value;
            }

            // Update Console
            const logs = document.getElementById('console-logs');
            const now = new Date().toLocaleTimeString();
            logs.innerHTML = `
                <div class="text-yellow-400">[${now}] [HTTP POST] 觸發表單提交事件 (Form Submit)</div>
                <div class="text-red-400">[${now}] [ALERT] 檢測到可疑網址外流數據！</div>
                <div class="text-slate-300">>> Target Host: ${config.url.split('/')[2]}</div>
                <div class="text-slate-300">>> Header: User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)</div>
                <div class="text-amber-300">>> Captured Payload: { username: "${userVal}", password: "${passVal.replace(/./g, '*')}" }</div>
                <div class="text-red-400 font-bold">[${now}] [SUCCESS] 側錄完成！金鑰與憑證已回傳 C2 伺服器 (模擬)</div>
            `;

            // Update Alert Card
            document.getElementById('captured-user').innerText = userVal;
            document.getElementById('captured-pass').innerText = passVal;
            document.getElementById('captured-domain').innerText = config.url.split('/')[2];
            document.getElementById('captured-analysis').innerText = config.analysis;

            // Show Card
            document.getElementById('interception-alert-card').classList.remove('hidden');
            document.getElementById('interception-status').innerText = '狀態: 攔截到側錄封包！';
            document.getElementById('interception-status').className = 'text-xs text-red-400 font-bold font-mono animate-pulse';
        }

        // ... existing JavaScript code ...
    </script>
